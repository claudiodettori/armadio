<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Il mio Armadio</title>
<meta name="description" content="Gestionale del guardaroba: capi con foto, outfit e calendario.">
<meta name="theme-color" content="#7A2848">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Armadio">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,500;0,6..96,700;1,6..96,500&family=Figtree:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: guardaroba da sartoria — cartellini appesi per i capi, un metro da sarto come striscia della settimana */
:root{
  --bg:#ECEEF0; --surface:#FFFFFF; --surface-2:#F4F5F7; --ink:#191C21; --muted:#5D6670; --line:#D3D8DE;
  --accent:#7A2848; --accent-ink:#FFFFFF; --accent-soft:#F2E4EA;
  --tape:#E8BE45; --tape-ink:#2A2310; --danger:#B3261E; --scrim:rgba(18,20,24,.45);
  --display:"Bodoni Moda","Didot","Bodoni 72",Georgia,serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#131519; --surface:#1B1E23; --surface-2:#22262C; --ink:#ECEEF1; --muted:#9BA4AF; --line:#30353D;
  --accent:#D9809F; --accent-ink:#1C1016; --accent-soft:#3A2330;
  --tape:#D8AE3C; --tape-ink:#221B07; --danger:#F08A80; --scrim:rgba(0,0,0,.6); color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#131519; --surface:#1B1E23; --surface-2:#22262C; --ink:#ECEEF1; --muted:#9BA4AF; --line:#30353D;
  --accent:#D9809F; --accent-ink:#1C1016; --accent-soft:#3A2330;
  --tape:#D8AE3C; --tape-ink:#221B07; --danger:#F08A80; --scrim:rgba(0,0,0,.6); color-scheme:dark }

*{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
img{max-width:100%}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--body);margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 64px}

/* header */
header.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 24px;padding-bottom:14px;border-bottom:1px solid var(--line)}
.brand h1{font-family:var(--display);font-style:italic;font-weight:500;font-size:clamp(30px,5vw,42px);line-height:1;margin:0;letter-spacing:-.01em}
.brand .meta{font-family:var(--mono);font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-top:8px;font-variant-numeric:tabular-nums}
nav.tabs{display:flex;gap:4px;flex-wrap:wrap;align-items:center}
.iconbtn{padding:8px}
.set-sec{display:flex;flex-direction:column;gap:10px;padding-bottom:16px;border-bottom:1px solid var(--line)}
.set-sec:last-child{border-bottom:0}
.set-sec h3{margin:0;font-family:var(--display);font-weight:500;font-size:20px}
.set-sec p{margin:0;font-size:13.5px;color:var(--muted);max-width:60ch}
.set-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
nav.tabs a{padding:8px 14px;border-radius:999px;text-decoration:none;color:var(--muted);font-weight:500}
nav.tabs a:hover{color:var(--ink);background:var(--surface-2)}
nav.tabs a[aria-current="page"]{background:var(--ink);color:var(--bg)}
.notice{margin-top:12px;font-size:13px;color:var(--muted);display:flex;gap:8px;align-items:center}
.notice[hidden]{display:none!important}

/* buttons */
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:8px;cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--ink);background:var(--surface-2)}
.btn.danger{color:var(--danger);border-color:transparent;background:transparent}
.btn.danger.solid{background:var(--danger);color:var(--surface);border-color:var(--danger)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn svg{width:16px;height:16px}

section.view{padding-top:22px}
.view-head{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-bottom:16px}
.view-head h2{font-family:var(--display);font-weight:500;font-size:26px;margin:0;text-wrap:balance}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}

/* tape measure week */
.weeknav{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.weeknav .range{font-family:var(--mono);font-size:12.5px;color:var(--muted);min-width:0}
.tape{position:relative;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));background:var(--tape);color:var(--tape-ink);border-radius:4px;box-shadow:0 1px 0 rgba(0,0,0,.08) inset,0 2px 6px rgba(0,0,0,.08);overflow:hidden}
.tape::before{content:"";position:absolute;inset:0 0 auto 0;height:14px;pointer-events:none;
  background:
   repeating-linear-gradient(90deg,var(--tape-ink) 0 1px,transparent 1px 100%) 0 0/calc(100%/7) 14px no-repeat,
   repeating-linear-gradient(90deg,var(--tape-ink) 0 1px,transparent 1px 8px) 0 0/100% 6px no-repeat,
   repeating-linear-gradient(90deg,var(--tape-ink) 0 1px,transparent 1px 40px) 0 0/100% 10px no-repeat;opacity:.55}
.tape button{all:unset;cursor:pointer;position:relative;padding:20px 4px 12px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:2px;border-left:1px solid rgba(0,0,0,.18);min-width:0}
.tape button:first-child{border-left:0}
.tape button:focus-visible{outline:2px solid var(--tape-ink);outline-offset:-4px}
.tape .dname{font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase}
.tape .dnum{font-family:var(--display);font-size:26px;line-height:1.05;font-weight:700;font-variant-numeric:lining-nums tabular-nums}
.tape .dot{height:8px;display:flex;gap:3px;align-items:center;justify-content:center}
.tape .dot i{width:7px;height:7px;border-radius:50%;background:var(--tape-ink)}
.tape .dot b{font-size:12px;line-height:8px;font-weight:700}
.tape .dot i.empty{background:transparent;border:1px dashed var(--tape-ink);opacity:.5}
.tape button[aria-pressed="true"]{background:rgba(0,0,0,.12)}
.tape button[aria-pressed="true"]::after{content:"";position:absolute;left:50%;bottom:0;transform:translateX(-50%);border:7px solid transparent;border-bottom-color:var(--bg);}
.tape .today-tag{position:absolute;top:2px;right:4px;font-family:var(--mono);font-size:9px;letter-spacing:.1em;font-weight:500;background:var(--tape-ink);color:var(--tape);padding:0 4px;border-radius:2px}

.day{margin-top:22px;display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:24px;align-items:start}
@media (max-width:780px){.day{grid-template-columns:1fr}}
.day-title{font-family:var(--display);font-size:clamp(26px,4vw,36px);font-weight:500;line-height:1.1;margin:4px 0 2px;text-wrap:balance}
.day-title em{font-style:italic;color:var(--accent)}
.day-panel{display:flex;flex-direction:column;gap:14px;min-width:0}
.day-actions{display:flex;flex-wrap:wrap;gap:8px}
.piece-list{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.piece-list li{list-style:none;display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:12px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.piece-list .thumb{width:44px;height:56px;border-radius:6px}
.piece-list .pn{font-weight:500;overflow-wrap:anywhere}
.piece-list .pc{font-size:12.5px;color:var(--muted)}
.piece-list .code{font-family:var(--mono);font-size:11.5px;color:var(--muted)}
.piece-list ul{margin:0;padding:0}
label.fl{display:flex;flex-direction:column;gap:6px;font-size:12.5px;color:var(--muted);font-weight:500}
textarea,input[type=text],input[type=search],input[type=date],select{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 11px;width:100%;min-width:0}
textarea{resize:vertical;min-height:70px}
textarea:focus,input:focus,select:focus{border-color:var(--accent);outline:none}

/* collage */
.collage{display:grid;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:6px;aspect-ratio:4/3.4;max-width:100%}
.collage.n1{grid-template-columns:1fr}
.collage.n2{grid-template-columns:1fr 1fr}
.collage.n3{grid-template-columns:1.3fr 1fr;grid-template-rows:1fr 1fr}
.collage.n3 .thumb:first-child{grid-row:span 2}
.collage.n4{grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr}
.collage.n5,.collage.n6{grid-template-columns:repeat(3,1fr);grid-template-rows:1fr 1fr}
.collage.n5 .thumb:first-child{grid-row:span 2}
.collage .thumb{border-radius:8px;min-height:0}
.collage.empty{place-items:center;text-align:center;color:var(--muted);border-style:dashed;padding:24px;background:transparent}
.collage.empty strong{display:block;font-family:var(--display);font-weight:500;font-size:22px;color:var(--ink);margin-bottom:4px}

/* thumb */
.thumb{position:relative;overflow:hidden;background:color-mix(in srgb,var(--c,#999) 16%,var(--surface-2));display:grid;place-items:center;color:var(--ink)}
.thumb svg{width:62%;height:62%;max-width:120px}
.thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:var(--surface-2)}

/* filters */
.filters{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:16px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:13px;cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.chip:hover{border-color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip .n{font-family:var(--mono);font-size:11px;opacity:.7;font-variant-numeric:tabular-nums}
.filters .search{flex:1 1 200px;max-width:320px}
.filters select{width:auto}

/* item cards as hang tags */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:18px 14px}
@media (max-width:440px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 10px}}
.tag{all:unset;cursor:pointer;display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px 8px 10px;position:relative;min-width:0;transition:transform .15s ease,border-color .15s}
.tag::before{content:"";position:absolute;top:6px;left:50%;width:7px;height:7px;transform:translateX(-50%);border-radius:50%;background:var(--bg);border:1px solid var(--line)}
.tag:hover{border-color:var(--ink);transform:translateY(-2px)}
.tag:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tag .thumb{aspect-ratio:3/4;border-radius:6px;width:100%}
.tag .tmeta{padding:8px 4px 0;display:flex;flex-direction:column;gap:2px;min-width:0}
.tag .tname{font-weight:600;font-size:14px;line-height:1.3;overflow-wrap:anywhere}
.tag .trow{display:flex;justify-content:space-between;gap:6px;font-size:12px;color:var(--muted);align-items:center}
.tag .code{font-family:var(--mono);font-size:11px}
.sw{width:10px;height:10px;border-radius:50%;display:inline-block;background:var(--c);border:1px solid color-mix(in srgb,var(--ink) 25%,transparent);flex:none}
.sw.multi{background:conic-gradient(#d9483b,#e3c04a,#3f7d5a,#4a6488,#6c4f8f,#d9483b)}
.badge{font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;padding:1px 6px;border-radius:3px;background:var(--accent-soft);color:var(--accent)}
.tag .badge{position:absolute;top:24px;left:14px}

/* outfits */
.ogrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px}
.ocard{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column;min-width:0}
.ocard .collage{border:0;border-radius:0;aspect-ratio:4/3;background:var(--surface-2)}
.ocard .obody{padding:12px 14px 14px;display:flex;flex-direction:column;gap:6px}
.ocard h3{font-family:var(--display);font-weight:500;font-size:20px;margin:0;line-height:1.2;overflow-wrap:anywhere}
.ocard .ometa{font-size:12.5px;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap}
.ocard .oact{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}

/* assistente */
.assist{margin-top:30px;padding-top:20px;border-top:1px solid var(--line)}
.assist-head{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:flex-end;justify-content:space-between;margin-bottom:12px}
.assist-head h3{font-family:var(--display);font-weight:500;font-size:26px;margin:2px 0 0;text-wrap:balance}
.assist-head p{margin:6px 0 0;font-size:13.5px;color:var(--muted);max-width:62ch}
.assist .chips{margin-bottom:14px}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px}
.pcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column;min-width:0}
.pcard .collage{border:0;border-radius:0;aspect-ratio:4/3;background:var(--surface-2)}
.pcard .pbody{padding:12px 14px 14px;display:flex;flex-direction:column;gap:8px;flex:1}
.pcard h4{margin:0;font-family:var(--display);font-weight:500;font-size:19px;line-height:1.25;overflow-wrap:anywhere}
.reasons{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:5px;font-size:13px;color:var(--muted)}
.reasons li{display:grid;grid-template-columns:8px minmax(0,1fr);gap:8px;align-items:baseline}
.reasons li::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--tape);border:1px solid color-mix(in srgb,var(--tape-ink) 30%,transparent)}
.pcard .oact{margin-top:auto;padding-top:4px;display:flex;gap:6px;flex-wrap:wrap}
.worn-badge{display:inline-flex;align-items:center;gap:4px;font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;padding:2px 7px;border-radius:3px;background:var(--ink);color:var(--bg)}
.hint{font-size:13px;color:var(--muted);margin:0}
.checkrow{display:flex;gap:10px;align-items:center;font-size:14px;cursor:pointer}
.checkrow input{width:18px;height:18px;accent-color:var(--accent)}
.empty-state{border:1px dashed var(--line);border-radius:12px;padding:40px 20px;text-align:center;color:var(--muted)}
.empty-state h3{font-family:var(--display);font-weight:500;color:var(--ink);font-size:24px;margin:0 0 6px}
.empty-state p{margin:0 auto 16px;max-width:46ch}

.stats{display:flex;gap:28px;flex-wrap:wrap;margin-top:28px;padding-top:16px;border-top:1px solid var(--line)}
.stat .v{font-family:var(--display);font-size:30px;line-height:1;font-variant-numeric:lining-nums tabular-nums}
.stat .l{font-size:12px;color:var(--muted)}

/* sheet */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:50;display:flex;justify-content:center;align-items:flex-end;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) 0 env(safe-area-inset-left,0px)}
@media (min-width:720px){.scrim{align-items:center;padding:24px}}
.sheet{background:var(--bg);width:100%;max-width:760px;max-height:92vh;max-height:92dvh;overflow:auto;border-radius:16px 16px 0 0;display:flex;flex-direction:column}
@media (min-width:720px){.sheet{border-radius:16px}}
.sheet-head{position:sticky;top:0;z-index:2;background:var(--bg);display:flex;justify-content:space-between;align-items:center;gap:12px;padding:16px 20px 12px;border-bottom:1px solid var(--line)}
.sheet-head h2{font-family:var(--display);font-weight:500;font-size:24px;margin:0}
.sheet-body{padding:18px 20px;display:flex;flex-direction:column;gap:16px}
.sheet-foot{position:sticky;bottom:0;background:var(--bg);border-top:1px solid var(--line);padding:12px 20px calc(12px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;justify-content:space-between;flex-wrap:wrap;align-items:center}
.sheet-foot .right{display:flex;gap:8px;margin-left:auto}
.form2{display:grid;grid-template-columns:minmax(0,220px) minmax(0,1fr);gap:20px}
@media (max-width:600px){.form2{grid-template-columns:1fr}}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fields .full{grid-column:1/-1}
@media (max-width:420px){.fields{grid-template-columns:1fr}}
.drop{border:1.5px dashed var(--line);border-radius:10px;aspect-ratio:3/4;display:grid;place-items:center;text-align:center;position:relative;overflow:hidden;cursor:pointer;background:var(--surface);color:var(--muted);font-size:13px;padding:12px}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.drop img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.drop .hint strong{display:block;color:var(--ink);font-weight:600;margin-bottom:4px}
.photo-actions{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.swatches{display:flex;flex-wrap:wrap;gap:6px}
.swatches button{all:unset;cursor:pointer;width:26px;height:26px;border-radius:50%;background:var(--c);border:1px solid color-mix(in srgb,var(--ink) 25%,transparent);position:relative}
.swatches button.multi{background:conic-gradient(#d9483b,#e3c04a,#3f7d5a,#4a6488,#6c4f8f,#d9483b)}
.swatches button[aria-pressed="true"]{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--ink)}
.swatches button:focus-visible{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--accent)}
.colorname{font-size:12.5px;color:var(--ink)}
.picker{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px}
.pick{all:unset;cursor:pointer;border:1px solid var(--line);border-radius:8px;padding:5px;background:var(--surface);display:flex;flex-direction:column;gap:4px;position:relative;min-width:0}
.pick .thumb{aspect-ratio:3/4;border-radius:5px}
.pick span{font-size:12px;line-height:1.25;overflow-wrap:anywhere}
.pick[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.pick[aria-pressed="true"]::after{content:"✓";position:absolute;top:8px;right:8px;width:20px;height:20px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-size:12px;font-weight:700}
.pick:focus-visible{outline:2px solid var(--accent)}
.olist{display:flex;flex-direction:column;gap:8px}
.orow{all:unset;cursor:pointer;display:grid;grid-template-columns:96px minmax(0,1fr);gap:12px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:6px;background:var(--surface)}
.orow:hover{border-color:var(--ink)}
.orow:focus-visible{outline:2px solid var(--accent)}
.orow[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.orow .collage{aspect-ratio:1;padding:3px;gap:3px;border:0;background:var(--surface-2)}
.orow .collage .thumb{border-radius:4px}
.orow .collage svg{width:70%;height:70%}
.orow h4{margin:0;font-family:var(--display);font-weight:500;font-size:18px}
.orow p{margin:2px 0 0;font-size:12.5px;color:var(--muted)}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13.5px}
.selcount{font-family:var(--mono);font-size:12px;color:var(--muted)}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:14px;z-index:80;max-width:calc(100% - 32px);box-shadow:0 6px 20px rgba(0,0,0,.2)}
.toast.err{background:var(--danger);color:var(--surface)}
.spin{width:14px;height:14px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;display:inline-block;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

<body>
<div class="wrap">
  <header class="top">

      <button class="btn ghost iconbtn" data-act="settings" aria-label="Backup e impostazioni" title="Backup e impostazioni"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
    </nav>

  <main id="main"></main>
</div>
<div id="sheetRoot"></div>
<div id="toastRoot" aria-live="polite"></div>

<script>
(function(){
"use strict";
/* ---------- costanti ---------- */
const CATEGORIE=["Capispalla","Maglie","Camicie","Pantaloni","Gonne","Abiti","Scarpe","Accessori"];
const STAGIONI=["Primavera","Estate","Autunno","Inverno"];
const OCCASIONI=["Casual","Lavoro","Elegante","Sport","Sera"];
const COLORI=[["Nero","#1E1F22"],["Bianco","#F7F7F4"],["Grigio","#9A9EA3"],["Blu navy","#24324F"],["Azzurro","#8FB3D9"],["Denim","#4A6488"],["Beige","#D9C7A6"],["Cammello","#B98A55"],["Marrone","#6B4A33"],["Verde oliva","#6F7346"],["Verde","#3F7D5A"],["Rosso","#B3262E"],["Bordeaux","#6E1F33"],["Rosa","#E8A8B8"],["Giallo","#E3C04A"],["Arancione","#D9783A"],["Viola","#6C4F8F"],["Multicolore","#C9A0DC"]];
const HEX=Object.fromEntries(COLORI);
const GIORNI=["Lunedì","Martedì","Mercoledì","Giovedì","Venerdì","Sabato","Domenica"];
const GIORNI_BREVI=["Lun","Mar","Mer","Gio","Ven","Sab","Dom"];
const MESI=["gennaio","febbraio","marzo","aprile","maggio","giugno","luglio","agosto","settembre","ottobre","novembre","dicembre"];
const GLYPH={
 Capispalla:'<path d="M30 16 L12 30 L8 92 L22 94 L28 48 L28 106 L72 106 L72 48 L78 94 L92 92 L88 30 L70 16 L58 16 L50 50 L42 16 Z"/>',
 Maglie:'<path d="M32 18 L12 32 L20 50 L30 44 L30 104 L70 104 L70 44 L80 50 L88 32 L68 18 Q60 28 50 28 Q40 28 32 18 Z"/>',
 Camicie:'<path d="M34 16 L14 28 L10 86 L22 88 L28 46 L30 104 L70 104 L72 46 L78 88 L90 86 L86 28 L66 16 L50 30 Z"/><path d="M50 30 L50 104" fill="none"/>',
 Pantaloni:'<path d="M30 14 L70 14 L75 106 L56 106 L50 44 L44 106 L25 106 Z"/>',
 Gonne:'<path d="M34 24 L66 24 L82 96 L18 96 Z"/>',
 Abiti:'<path d="M38 12 L44 12 Q50 22 56 12 L62 12 L64 34 L58 46 L82 106 L18 106 L42 46 L36 34 Z"/>',
 Scarpe:'<path d="M12 74 L12 52 L34 52 Q40 66 58 68 L82 74 Q92 78 90 90 L12 90 Z"/>',
 Accessori:'<path d="M36 52 Q36 28 50 28 Q64 28 64 52" fill="none"/><path d="M20 52 L80 52 L86 102 L14 102 Z"/>'
};
const LOCAL_KEY="armadio-v1";

/* ---------- stato ---------- */
const S={sort:"cat",propOcc:{},propRound:{},propOpen:null,lastProps:[],capi:{},outfit:{},giorni:{},tab:"settimana",cat:"Tutti",stag:"",occ:"",q:"",sel:todayKey(),week:null,canWrite:true,mode:"loading",};
const FOTO={}; // id foto -> URL locale
S.week=weekStart(S.sel);
let sheet=null; // stato del pannello aperto

/* ---------- utilità ---------- */
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function pad(n){return String(n).padStart(2,"0")}
function keyOf(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())}
function todayKey(){return keyOf(new Date())}
function parseKey(k){const [y,m,d]=k.split("-").map(Number);return new Date(y,m-1,d)}
function addDays(k,n){const d=parseKey(k);d.setDate(d.getDate()+n);return keyOf(d)}
function weekStart(k){const d=parseKey(k);const wd=(d.getDay()+6)%7;d.setDate(d.getDate()-wd);return keyOf(d)}
function dayIdx(k){return (parseKey(k).getDay()+6)%7}
function longDate(k){const d=parseKey(k);return GIORNI[dayIdx(k)]+" "+d.getDate()+" "+MESI[d.getMonth()]}
function shortDate(k){const d=parseKey(k);return d.getDate()+" "+MESI[d.getMonth()].slice(0,3)}
function newId(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8)}
function code(n){return "N° "+String(n||0).padStart(3,"0")}
function catOrder(c){const i=CATEGORIE.indexOf(c);return i<0?99:i}
function sortCapi(list){return list.sort((a,b)=>catOrder(a.categoria)-catOrder(b.categoria)||(a.num||0)-(b.num||0))}
function capiList(){return sortCapi(Object.values(S.capi))}
function outfitList(){return Object.values(S.outfit).sort((a,b)=>(b.creato||0)-(a.creato||0))}
function photoSrc(c){if(c.foto&&FOTO[c.foto])return FOTO[c.foto];return ""}
function colorHex(c){return HEX[c.colore]||"#9A9EA3"}
function thumb(c,extra){
  if(!c)return '<div class="thumb"></div>';
  const g=GLYPH[c.categoria]||GLYPH.Maglie;const hex=colorHex(c);const src=photoSrc(c);
  return '<div class="thumb'+(extra?" "+extra:"")+'" style="--c:'+hex+'"><svg viewBox="0 0 100 120" aria-hidden="true"><g fill="'+hex+'" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round">'+g+'</g></svg>'+(src?'<img src="'+esc(src)+'" alt="'+esc(c.nome)+'" loading="lazy">':"")+'</div>';
}
function swatch(c){return '<span class="sw'+(c.colore==="Multicolore"?" multi":"")+'" style="--c:'+colorHex(c)+'"></span>'}
function outfitCapi(o){return sortCapi((o?.capi||[]).map(id=>S.capi[id]).filter(Boolean))}
function collage(o,cls){
  const items=outfitCapi(o).slice(0,6);
  if(!items.length)return '<div class="collage empty '+(cls||"")+'"><div>Nessun capo in questo outfit</div></div>';
  return '<div class="collage n'+items.length+' '+(cls||"")+'">'+items.map(c=>thumb(c)).join("")+'</div>';
}
function dayRec(k){ // cosa c'è in un giorno: capi, outfit, se è stato indossato
  const g=S.giorni[k];if(!g)return null;
  const o=g.outfit?S.outfit[g.outfit]||null:null;
  const custom=!!(g.capi&&g.capi.length);
  const ids=(custom?g.capi:(o?o.capi||[]:[])).filter(id=>S.capi[id]);
  const worn=ids.length>0&&(g.indossato===true||(g.indossato!==false&&k<todayKey()));
  const nome=(!custom&&o)?o.nome:(worn?"Outfit del giorno":"Proposta dell'assistente");
  return {g,o:custom?null:o,ids,worn,nome};
}
function wornIds(k){const r=dayRec(k);return r&&r.worn?r.ids:null}
function lastWorn(){ // capo id -> ultima data in cui è stato indossato
  const t=todayKey(),m={};
  for(const k of Object.keys(S.giorni)){if(k>t)continue;const ids=wornIds(k);if(!ids)continue;for(const id of ids){if(!m[id]||m[id]<k)m[id]=k}}
  return m;
}
function wornCount(){const t=todayKey(),m={};for(const k of Object.keys(S.giorni)){if(k>t)continue;const ids=wornIds(k);if(ids)ids.forEach(id=>m[id]=(m[id]||0)+1)}return m}
function outfitWorn(oid){const t=todayKey();return Object.keys(S.giorni).filter(k=>k<=t&&S.giorni[k].outfit===oid&&dayRec(k)?.worn&&!(S.giorni[k].capi&&S.giorni[k].capi.length)).length}
function volte(n){return n+(n===1?" volta":" volte")}
function sameSet(a,b){if(!a||!b||a.length!==b.length)return false;const x=new Set(a);return b.every(i=>x.has(i))}

/* ---------- assistente ---------- */
const NEUTRI=new Set(["Nero","Bianco","Grigio","Blu navy","Beige","Cammello","Marrone","Denim"]);
const STAG_ART={Inverno:"all'inverno",Primavera:"alla primavera",Estate:"all'estate",Autunno:"all'autunno"};
function seasonOf(k){const m=parseKey(k).getMonth();return (m===11||m<=1)?"Inverno":m<=4?"Primavera":m<=7?"Estate":"Autunno"}
function daysBetween(a,b){return Math.round((parseKey(b)-parseKey(a))/86400000)}
function pk(a,b){return a<b?a+"|"+b:b+"|"+a}
function rng(str){let h=1779033703^str.length;for(let i=0;i<str.length;i++){h=Math.imul(h^str.charCodeAt(i),3432918353);h=h<<13|h>>>19}let a=h>>>0;return()=>{a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function majorityOcc(ids){const c={};for(const id of ids){const x=S.capi[id];if(!x||!x.occasione||x.categoria==="Scarpe"||x.categoria==="Accessori")continue;c[x.occasione]=(c[x.occasione]||0)+1}let best="",n=0;for(const [o,v] of Object.entries(c))if(v>n){best=o;n=v}return best}
function habits(k){ // abitudini apprese dallo storico prima del giorno k
  const t=todayKey(),cnt={},cnt90={},last={},pair={},occWd={};let days=0;
  for(const d of Object.keys(S.giorni)){
    if(!(d<k&&d<=t))continue;const ids=wornIds(d);if(!ids)continue;days++;
    const age=daysBetween(d,t);
    for(const id of ids){cnt[id]=(cnt[id]||0)+1;if(age<=90)cnt90[id]=(cnt90[id]||0)+1;if(!last[id]||last[id]<d)last[id]=d}
    for(let i=0;i<ids.length;i++)for(let j=i+1;j<ids.length;j++){const p=pk(ids[i],ids[j]);pair[p]=(pair[p]||0)+1}
    const oc=majorityOcc(ids);if(oc){const w=dayIdx(d);if(!occWd[w])occWd[w]={};occWd[w][oc]=(occWd[w][oc]||0)+1}
  }
  const opair={};
  for(const o of Object.values(S.outfit)){const ids=(o.capi||[]).filter(id=>S.capi[id]);for(let i=0;i<ids.length;i++)for(let j=i+1;j<ids.length;j++){const p=pk(ids[i],ids[j]);opair[p]=(opair[p]||0)+1}}
  const near=new Set();for(const d of [addDays(k,-1),addDays(k,1)]){const r=dayRec(d);if(r)r.ids.forEach(id=>near.add(id))}
  const recent=new Set();for(let i=-7;i<=7;i++){if(!i)continue;const r=dayRec(addDays(k,i));if(r&&r.ids.length)recent.add([...r.ids].sort().join(","))}
  return {cnt,cnt90,last,pair,opair,occWd,days,near,recent};
}
function defaultOcc(k,H){
  const w=dayIdx(k),m=H.occWd[w];
  if(m){let best="",n=0;for(const [o,v] of Object.entries(m))if(v>n){best=o;n=v}if(best)return best}
  const has=o=>Object.values(S.capi).some(c=>c.occasione===o);
  if(w<5&&has("Lavoro"))return "Lavoro";
  if(has("Casual"))return "Casual";
  return "";
}
function itemScore(c,H,k,occ){
  let s=Math.log2(1+(H.cnt90[c.id]||0))*1.2;
  if(!H.cnt[c.id])s+=.25;
  const l=H.last[c.id];
  if(H.near.has(c.id))s-=4.5;else if(l&&daysBetween(l,k)<=2)s-=2;
  if(l&&daysBetween(l,k)>21)s+=.4;
  if(occ&&c.occasione){const soft=c.categoria==="Scarpe"||c.categoria==="Accessori";s+=c.occasione===occ?.8:(soft?-.3:-.7)}
  return s;
}
function comboScore(ids,H,IS){
  let m=0;for(const id of ids)m+=IS[id];m/=ids.length;
  let ps=0,np=0;for(let i=0;i<ids.length;i++)for(let j=i+1;j<ids.length;j++){const p=pk(ids[i],ids[j]);ps+=Math.min(H.pair[p]||0,3)/3+.5*Math.min(H.opair[p]||0,1);np++}
  let s=m*1.6+(np?ps/np:0)*1.2+ids.length*.12;
  if(H.recent.has([...ids].sort().join(",")))s-=2.5;
  const cols=new Set(ids.map(id=>S.capi[id].colore).filter(c=>c&&!NEUTRI.has(c)));
  const nc=cols.size+(cols.has("Multicolore")?1:0);
  s+=nc<=1?.3:nc===2?0:-(nc-2);
  return s;
}
function proposals(k,occ,round){
  const stag=seasonOf(k),all=capiList();
  const fits=c=>!(c.stagioni&&c.stagioni.length)||c.stagioni.includes(stag);
  let pool=all.filter(fits);
  const baseOk=p=>(p.some(c=>c.categoria==="Maglie"||c.categoria==="Camicie")&&p.some(c=>c.categoria==="Pantaloni"||c.categoria==="Gonne"))||p.some(c=>c.categoria==="Abiti");
  if(!baseOk(pool))pool=all;
  const H=habits(k);
  if(!baseOk(pool))return {list:[],H,stag};
  const IS={};all.forEach(c=>IS[c.id]=itemScore(c,H,k,occ));
  const R=rng(k+"|"+(occ||"-")+"|"+round);
  const by=(...cats)=>pool.filter(c=>cats.includes(c.categoria));
  const tops=by("Maglie","Camicie"),bots=by("Pantaloni","Gonne"),dress=by("Abiti"),shoes=by("Scarpe"),outer=by("Capispalla"),acc=by("Accessori");
  const pick=list=>{const w=list.map(c=>Math.exp(IS[c.id]*.9));let r=R()*w.reduce((a,b)=>a+b,0);for(let i=0;i<list.length;i++){r-=w[i];if(r<=0)return list[i]}return list[list.length-1]};
  const canSep=tops.length&&bots.length;
  const pOuter=stag==="Inverno"?1:stag==="Estate"?.1:.6;
  const pDress=(occ==="Sera"||occ==="Elegante")?.55:.22;
  const cands=new Map();
  const add=(ids,src)=>{const key=[...ids].sort().join(",");if(cands.has(key))return;cands.set(key,{ids,src,score:comboScore(ids,H,IS)+(src?.5:0)+R()*.5})};
  for(const o of Object.values(S.outfit)){const ids=(o.capi||[]).filter(id=>S.capi[id]);if(ids.length<2||!ids.every(id=>pool.some(c=>c.id===id)))continue;add(ids,o)}
  for(let i=0;i<180;i++){
    const ids=[];
    if(dress.length&&(!canSep||R()<pDress))ids.push(pick(dress).id);else ids.push(pick(tops).id,pick(bots).id);
    if(shoes.length)ids.push(pick(shoes).id);
    if(outer.length&&R()<pOuter)ids.push(pick(outer).id);
    if(acc.length&&R()<.5)ids.push(pick(acc).id);
    add(ids,null);
  }
  const sorted=[...cands.values()].sort((a,b)=>b.score-a.score),out=[];
  const ov=(a,b)=>a.filter(x=>b.includes(x)).length;
  for(const c of sorted){if(out.length>=3)break;if(out.some(o=>ov(o.ids,c.ids)>Math.min(o.ids.length,c.ids.length)/2))continue;out.push(c)}
  for(const c of sorted){if(out.length>=3)break;if(!out.includes(c))out.push(c)}
  const used=new Set();
  out.forEach(p=>{p.ids=sortCapi(p.ids.map(id=>S.capi[id])).map(c=>c.id);p.nome=p.src?p.src.nome:propName(p.ids);
    if(used.has(p.nome)){const extra=p.ids.map(id=>S.capi[id]).find(c=>!p.nome.toLowerCase().includes(c.nome.toLowerCase())&&c.categoria!=="Accessori");if(extra)p.nome+=" con "+extra.nome.toLowerCase()}
    used.add(p.nome);p.reasons=reasonsFor(p,H,k,occ,stag)});
  return {list:out,H,stag};
}
function propName(ids){
  const it=ids.map(id=>S.capi[id]);
  const d=it.find(c=>c.categoria==="Abiti");if(d)return d.nome;
  const top=it.find(c=>c.categoria==="Maglie"||c.categoria==="Camicie"),bot=it.find(c=>c.categoria==="Pantaloni"||c.categoria==="Gonne");
  return [top,bot].filter(Boolean).map((c,i)=>i?c.nome.toLowerCase():c.nome).join(" e ");
}
function reasonsFor(p,H,k,occ,stag){
  const r=[],it=p.ids.map(id=>S.capi[id]);
  if(p.src)r.push("È il tuo outfit salvato «"+p.src.nome+"»");
  const fav=it.filter(c=>(H.cnt90[c.id]||0)>=2).sort((a,b)=>H.cnt90[b.id]-H.cnt90[a.id])[0];
  if(fav)r.push("Metti spesso "+fav.nome.toLowerCase()+" ("+volte(H.cnt90[fav.id])+" di recente)");
  if(!p.src){let bp=null,bn=0;for(let i=0;i<it.length;i++)for(let j=i+1;j<it.length;j++){const n=H.pair[pk(it[i].id,it[j].id)]||0;if(n>bn){bn=n;bp=[it[i],it[j]]}}
    if(bp&&bn>=1)r.push(bp[0].nome+" e "+bp[1].nome.toLowerCase()+": li hai già abbinati "+volte(bn))}
  const red=it.find(c=>H.last[c.id]&&daysBetween(H.last[c.id],k)>21);
  if(red)r.push(red.nome+": non lo metti da "+daysBetween(H.last[red.id],k)+" giorni");
  const nw=it.find(c=>!H.cnt[c.id]);
  if(nw)r.push("Da provare: "+nw.nome.toLowerCase()+", non l'hai ancora messo");
  if(occ&&majorityOcc(p.ids)===occ)r.push("Adatto a: "+occ.toLowerCase());
  r.push("Capi adatti "+STAG_ART[stag]);
  return r.slice(0,3);
}
function assistantHTML(k){
  const t=todayKey();if(k<t||!S.canWrite)return "";
  const r=dayRec(k),has=!!(r&&r.ids.length);
  const title=k===t?"Cosa mettere oggi":"Proposte per "+longDate(k).replace(/^./,c=>c.toLowerCase());
  let h='<section class="assist" aria-labelledby="assistTitle"><div class="assist-head"><div><div class="eyebrow">Assistente</div><h3 id="assistTitle">'+esc(title)+'</h3>';
  if(has&&S.propOpen!==k){
    return h+'<p>Per questo giorno hai già scelto un outfit. Vuoi vedere qualche alternativa?</p></div><button class="btn" data-act="showProp">Mostra proposte alternative</button></div></section>';
  }
  if(!Object.keys(S.capi).length){S.lastProps=[];return h+'<p>Aggiungi i tuoi capi e ogni giorno qui troverai tre outfit pensati per te.</p></div></div></section>'}
  const H0=habits(k);
  const occ=(k in S.propOcc)?S.propOcc[k]:defaultOcc(k,H0);
  const P=proposals(k,occ,S.propRound[k]||0);S.lastProps=P.list;
  h+='<p>'+(P.H.days>=5?"Basate su "+P.H.days+" giorni registrati: i capi che metti più spesso, gli abbinamenti che ti piacciono, la stagione e quello che hai messo ieri.":"Per ora le proposte usano i capi adatti "+STAG_ART[P.stag]+" e i tuoi outfit salvati. Registra cosa indossi ogni giorno: più giorni registri, più le proposte ti somigliano.")+'</p></div>'+
     (P.list.length?'<button class="btn" data-act="propMore">Altre proposte</button>':'')+'</div>';
  const occs=OCCASIONI.filter(o=>Object.values(S.capi).some(c=>c.occasione===o));
  if(occs.length)h+='<div class="chips" role="group" aria-label="Occasione">'+[["","Qualsiasi"],...occs.map(o=>[o,o])].map(([v,l])=>'<button class="chip" data-act="propOcc" data-v="'+v+'" aria-pressed="'+(occ===v)+'">'+l+'</button>').join("")+'</div>';
  if(!P.list.length)return h+'<p class="hint">Per comporre un outfit servono almeno una maglia o camicia e un paio di pantaloni o una gonna, oppure un abito.</p></section>';
  h+='<div class="pgrid">'+P.list.map((p,i)=>'<article class="pcard">'+collage({capi:p.ids})+'<div class="pbody"><h4>'+esc(p.nome)+'</h4><ul class="reasons">'+p.reasons.map(x=>'<li>'+esc(x)+'</li>').join("")+'</ul><div class="oact"><button class="btn primary" data-act="propUse" data-i="'+i+'">'+(k===t?"Lo metto oggi":"Pianifica")+'</button>'+(p.src?'':'<button class="btn ghost" data-act="propSave" data-i="'+i+'">Salva come outfit</button>')+'</div></div></article>').join("")+'</div>';
  return h+'</section>';
}
function plannedCount(oid){return Object.values(S.giorni).filter(g=>g.outfit===oid).length}
function nextPlanned(oid){const t=todayKey();return Object.keys(S.giorni).filter(k=>k>=t&&S.giorni[k].outfit===oid).sort()[0]}

/* ---------- archiviazione (IndexedDB su questo dispositivo) ---------- */
let IDB=null;
function idbOpen(){return new Promise((res,rej)=>{const r=indexedDB.open("armadio",1);r.onupgradeneeded=()=>{const d=r.result;if(!d.objectStoreNames.contains("docs"))d.createObjectStore("docs");if(!d.objectStoreNames.contains("foto"))d.createObjectStore("foto")};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);r.onblocked=()=>rej(new Error("blocked"))})}
function tx(stores,mode,fn){if(!IDB)return Promise.resolve();return new Promise((res,rej)=>{const t=IDB.transaction(stores,mode);let out;const r=fn(t);if(r&&"onsuccess" in r)r.onsuccess=()=>{out=r.result};t.oncomplete=()=>res(out);t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error||new Error("abort"))})}
async function putDoc(col,id,data){await tx("docs","readwrite",t=>t.objectStore("docs").put(data,col+"/"+id));S[col][id]=data;render()}
async function delDoc(col,id){await tx("docs","readwrite",t=>t.objectStore("docs").delete(col+"/"+id));delete S[col][id];render()}
async function putMany(entries){ // [{col,id,data|null}]
  await tx("docs","readwrite",t=>{const st=t.objectStore("docs");entries.forEach(e=>e.data?st.put(e.data,e.col+"/"+e.id):st.delete(e.col+"/"+e.id))});
  entries.forEach(e=>{if(e.data)S[e.col][e.id]=e.data;else delete S[e.col][e.id]});render();
}
async function putFoto(id,blob){await tx("foto","readwrite",t=>t.objectStore("foto").put(blob,id));FOTO[id]=URL.createObjectURL(blob)}
async function delFoto(id){if(!id)return;await tx("foto","readwrite",t=>t.objectStore("foto").delete(id));if(FOTO[id]){URL.revokeObjectURL(FOTO[id]);delete FOTO[id]}}
function readStore(name){if(!IDB)return Promise.resolve([]);return new Promise((res,rej)=>{const out=[];const t=IDB.transaction(name,"readonly");const c=t.objectStore(name).openCursor();c.onsuccess=()=>{const cur=c.result;if(cur){out.push([cur.key,cur.value]);cur.continue()}};t.oncomplete=()=>res(out);t.onerror=()=>rej(t.error)})}
async function loadAll(){
  S.capi={};S.outfit={};S.giorni={};
  for(const [k,v] of await readStore("docs")){const i=k.indexOf("/");const col=k.slice(0,i),id=k.slice(i+1);if(S[col])S[col][id]=v}
  for(const [k,v] of await readStore("foto")){if(FOTO[k])URL.revokeObjectURL(FOTO[k]);FOTO[k]=URL.createObjectURL(v)}
}
async function wipeAll(){await tx(["docs","foto"],"readwrite",t=>{t.objectStore("docs").clear();t.objectStore("foto").clear()});Object.keys(FOTO).forEach(k=>{URL.revokeObjectURL(FOTO[k]);delete FOTO[k]});S.capi={};S.outfit={};S.giorni={}}
function errMsg(e){
  const c=e&&(e.code||e.name);
  if(c==="QuotaExceededError")return "Memoria del dispositivo piena: elimina qualche foto e riprova";
  if(c==="quota_exceeded"||c==="quota_or_state")return "Spazio di archiviazione pieno: elimina qualche capo o foto e riprova";
  if(c==="too_large")return "La foto è troppo grande (massimo 20 MB)";
  if(c==="unsupported_type")return "Formato immagine non supportato: usa JPG, PNG o WebP";
  if(c==="invalid_argument")return "Non hai i permessi per modificare questo armadio";
  return "Salvataggio non riuscito, riprova tra poco";
}

/* ---------- immagini ---------- */
function loadImg(file){return new Promise((res,rej)=>{const u=URL.createObjectURL(file);const i=new Image();i.onload=()=>{res(i)};i.onerror=()=>{URL.revokeObjectURL(u);rej(new Error("decode"))};i.src=u})}
async function compress(file,max,q){
  const img=await loadImg(file);
  const s=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight));
  const w=Math.round(img.naturalWidth*s),h=Math.round(img.naturalHeight*s);
  const cv=document.createElement("canvas");cv.width=w;cv.height=h;
  const cx=cv.getContext("2d");cx.fillStyle="#fff";cx.fillRect(0,0,w,h);cx.drawImage(img,0,0,w,h);
  URL.revokeObjectURL(img.src);
  return {blob:await new Promise(r=>cv.toBlob(r,"image/jpeg",q)),dataUrl:()=>cv.toDataURL("image/jpeg",q)};
}

}

function renderCapi(){
  const all=capiList(),lw=lastWorn(),wc=wornCount();
  const counts={};all.forEach(c=>counts[c.categoria]=(counts[c.categoria]||0)+1);
  const q=S.q.trim().toLowerCase();
  const list=all.filter(c=>(S.cat==="Tutti"||c.categoria===S.cat)&&(!S.stag||(c.stagioni||[]).includes(S.stag))&&(!S.occ||c.occasione===S.occ)&&(!q||[c.nome,c.marca,c.colore,c.note].join(" ").toLowerCase().includes(q)));
  if(S.sort==="piu")list.sort((a,b)=>(wc[b.id]||0)-(wc[a.id]||0));
  else if(S.sort==="meno")list.sort((a,b)=>(wc[a.id]||0)-(wc[b.id]||0)||((lw[a.id]||"")<(lw[b.id]||"")?-1:1));
  else if(S.sort==="nuovi")list.sort((a,b)=>(b.creato||0)-(a.creato||0)||(b.num||0)-(a.num||0));
  let h='<section class="view"><div class="view-head"><div><div class="eyebrow">Inventario</div><h2>I capi</h2></div>'+wbtn(ICON.plus+" Aggiungi capo",'data-act="newItem"',"primary")+'</div>';
  if(!all.length){
    main.innerHTML=h+'<div class="empty-state"><h3>L\'armadio è vuoto</h3><p>'+(isLoading()?"Sto caricando i tuoi capi…":"Aggiungi il primo capo: scatta o carica una foto, scegli categoria, colore e stagione.")+'</p>'+(!isLoading()?'<div class="set-row" style="justify-content:center">'+wbtn(ICON.plus+" Aggiungi il primo capo",'data-act="newItem"',"primary")+wbtn("Prova con capi di esempio",'data-act="loadEx"')+'</div>':"")+'</div></section>';return;
  }
  h+='<div class="filters"><div class="chips" role="group" aria-label="Categoria">'+["Tutti",...CATEGORIE].map(c=>'<button class="chip" data-act="cat" data-v="'+c+'" aria-pressed="'+(S.cat===c)+'">'+c+' <span class="n">'+(c==="Tutti"?all.length:(counts[c]||0))+'</span></button>').join("")+'</div></div>';
  h+='<div class="filters"><input type="search" class="search" id="q" placeholder="Cerca per nome, marca, colore…" value="'+esc(S.q)+'" aria-label="Cerca capi">'+
   '<select id="fStag" aria-label="Stagione"><option value="">Tutte le stagioni</option>'+STAGIONI.map(s=>'<option'+(S.stag===s?" selected":"")+'>'+s+'</option>').join("")+'</select>'+
   '<select id="fOcc" aria-label="Occasione"><option value="">Tutte le occasioni</option>'+OCCASIONI.map(s=>'<option'+(S.occ===s?" selected":"")+'>'+s+'</option>').join("")+'</select>'+
   '<select id="fSort" aria-label="Ordina">'+[["cat","Per categoria"],["piu","Più indossati"],["meno","Meno indossati"],["nuovi","Ultimi aggiunti"]].map(([v,l])=>'<option value="'+v+'"'+(S.sort===v?" selected":"")+'>'+l+'</option>').join("")+'</select></div>';
  if(!list.length)h+='<div class="empty-state"><h3>Nessun capo trovato</h3><p>Prova a cambiare categoria, stagione o testo di ricerca.</p></div>';
  else h+='<div class="grid">'+list.map(c=>'<button class="tag" data-act="editItem" data-id="'+c.id+'" aria-label="'+esc(c.nome)+'">'+(c.esempio?'<span class="badge">Esempio</span>':'')+thumb(c)+'<div class="tmeta"><div class="tname">'+esc(c.nome)+'</div><div class="trow"><span style="display:flex;gap:5px;align-items:center;min-width:0">'+swatch(c)+esc(c.categoria)+'</span><span class="code">'+code(c.num)+'</span></div><div class="trow"><span>'+(wc[c.id]?"Indossato "+volte(wc[c.id])+" · "+shortDate(lw[c.id]):"Mai indossato")+'</span></div></div></button>').join("")+'</div>';
  main.innerHTML=h+'</section>';
}

    main.innerHTML=h+'<div class="empty-state"><h3>Nessun outfit salvato</h3><p>'+(Object.keys(S.capi).length?"Componi un outfit scegliendo i capi dal tuo armadio, poi assegnalo a una giornata.":"Prima aggiungi qualche capo nella sezione Capi, poi combinali qui in outfit.")+'</p>'+(!isLoading()?wbtn(Object.keys(S.capi).length?ICON.plus+" Componi il primo outfit":"Vai ai capi",Object.keys(S.capi).length?'data-act="newOutfit"':'data-act="goto" data-v="capi"',"primary"):"")+'</div></section>';return;

    (S.canWrite?'<div class="oact"><button class="btn" data-act="planOutfit" data-id="'+o.id+'">'+ICON.cal+' Pianifica</button><button class="btn ghost" data-act="editOutfit" data-id="'+o.id+'">Modifica</button></div>':'')+'</div></article>'}).join("")+'</div>';

const root=document.getElementById("sheetRoot");
let lastFocus=null;
function openSheet(state){lastFocus=document.activeElement;sheet=state;drawSheet();setTimeout(()=>{const f=root.querySelector("[data-autofocus]")||root.querySelector(".sheet input,.sheet button");f&&f.focus()},30)}
function closeSheet(){sheet=null;root.innerHTML="";lastFocus&&lastFocus.focus&&lastFocus.focus()}
function drawSheet(){
  if(!sheet){root.innerHTML="";return}
  const sc=root.querySelector(".sheet");const top=sc?sc.scrollTop:0;
  let html="";
  if(sheet.type==="item")html=itemSheet();else if(sheet.type==="outfit")html=outfitSheet();else if(sheet.type==="plan")html=planSheet();else if(sheet.type==="planOutfit")html=planOutfitSheet();else if(sheet.type==="settings")html=settingsSheet();else if(sheet.type==="worn")html=wornSheet();
  root.innerHTML='<div class="scrim" data-act="scrim"><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">'+html+'</div></div>';
  const ns=root.querySelector(".sheet");if(ns)ns.scrollTop=top;
}

/* ---------- eventi ---------- */
document.addEventListener("click",async e=>{
  const t=e.target.closest("[data-act]");if(!t)return;
  const a=t.dataset.act;
  if(a==="scrim"){if(e.target===t)closeSheet();return}
  switch(a){
    case "close":closeSheet();break;
    case "settings":openSheet({type:"settings"});try{const est=await navigator.storage?.estimate?.();if(est&&sheet?.type==="settings"){sheet.usage=(est.usage/1048576).toFixed(1)+" MB usati";drawSheet()}}catch(_){}break;
    case "export":exportBackup();break;
    case "importYes":importBackup();break;
    case "importNo":sheet.pendingImport=null;drawSheet();break;
    case "loadEx":loadExamples();break;
    case "rmEx":removeExamples();break;
    case "wipe":sheet.confirmWipe=true;drawSheet();break;
    case "wipeNo":sheet.confirmWipe=false;drawSheet();break;
    case "wipeYes":try{await wipeAll();render();toast("Armadio svuotato");closeSheet()}catch(err){toast(errMsg(err),true)}break;
    case "week":S.week=addDays(S.week,+t.dataset.d);S.sel=addDays(S.sel,+t.dataset.d);render();break;
    case "today":S.sel=todayKey();S.week=weekStart(S.sel);render();break;
    case "sel":S.sel=t.dataset.k;render();break;
    case "goto":location.hash=t.dataset.v;break;
    case "cat":S.cat=t.dataset.v;render();break;
    case "plan":openSheet({type:"plan",k:t.dataset.k});break;
    case "unplan":{const k=t.dataset.k,g=S.giorni[k];try{if(g?.nota)await putDoc("giorni",k,{outfit:"",nota:g.nota});else await delDoc("giorni",k);toast("Outfit tolto dal giorno")}catch(err){toast(errMsg(err),true)}break}
    case "assign":{const k=sheet.k,g=S.giorni[k],doc={outfit:t.dataset.id,nota:g?.nota||""};if(k<=todayKey())doc.indossato=true;try{await putDoc("giorni",k,doc);toast((doc.indossato?"Registrato: ":"Outfit assegnato a ")+longDate(k));closeSheet()}catch(err){toast(errMsg(err),true)}break}
    case "wornOpen":{const r=dayRec(S.sel);openSheet({type:"worn",k:S.sel,cat:"Tutti",d:{capi:(r?r.ids:[]).slice()},saveAs:false,nome:""});break}
    case "wcat":readWornFields();sheet.cat=t.dataset.v;drawSheet();break;
    case "wtoggle":{readWornFields();const id=t.dataset.id,c=sheet.d.capi;sheet.d.capi=c.includes(id)?c.filter(x=>x!==id):[...c,id];drawSheet();root.querySelector('[data-act="wtoggle"][data-id="'+id+'"]')?.focus();break}
    case "wornSave":saveWorn();break;
    case "markWorn":{const k=S.sel,g=S.giorni[k];try{await putDoc("giorni",k,{...g,indossato:true});toast("Registrato: "+longDate(k))}catch(err){toast(errMsg(err),true)}break}
    case "unwear":{const k=S.sel,g=S.giorni[k];try{await putDoc("giorni",k,{...g,indossato:false});toast("Registrazione annullata")}catch(err){toast(errMsg(err),true)}break}
    case "saveDayOutfit":{const r=dayRec(S.sel);if(r)openSheet({type:"outfit",cat:"Tutti",forDate:S.sel,d:{capi:r.ids.slice(),occasione:majorityOcc(r.ids)}});break}
    case "showProp":S.propOpen=S.sel;render();break;
    case "propOcc":S.propOcc[S.sel]=t.dataset.v;render();break;
    case "propMore":S.propRound[S.sel]=(S.propRound[S.sel]||0)+1;render();break;
    case "propUse":{const p=S.lastProps[+t.dataset.i];if(!p)break;const k=S.sel,g=S.giorni[k],doc={nota:g?.nota||""};
      if(p.src)doc.outfit=p.src.id;else{doc.outfit="";doc.capi=p.ids.slice()}
      if(k===todayKey())doc.indossato=true;
      try{await putDoc("giorni",k,doc);S.propOpen=null;toast(k===todayKey()?"Registrato come outfit di oggi":"Pianificato per "+longDate(k))}catch(err){toast(errMsg(err),true)}break}
    case "propSave":{const p=S.lastProps[+t.dataset.i];if(p)openSheet({type:"outfit",cat:"Tutti",d:{capi:p.ids.slice(),nome:"",occasione:(S.sel in S.propOcc)?S.propOcc[S.sel]:majorityOcc(p.ids)}});break}
    case "newItem":openSheet({type:"item",d:{categoria:S.cat!=="Tutti"?S.cat:"Maglie",stagioni:[]}});break;
    case "editItem":{if(!S.canWrite)return;const c=S.capi[t.dataset.id];if(c)openSheet({type:"item",id:c.id,d:JSON.parse(JSON.stringify(c))});break}
    case "color":readItemFields();sheet.d.colore=t.dataset.v;drawSheet();root.querySelector('[data-act="color"][data-v="'+t.dataset.v+'"]')?.focus();break;
    case "season":{readItemFields();const s=sheet.d.stagioni||(sheet.d.stagioni=[]);const v=t.dataset.v;sheet.d.stagioni=s.includes(v)?s.filter(x=>x!==v):[...s,v];drawSheet();root.querySelector('[data-act="season"][data-v="'+v+'"]')?.focus();break}
    case "rmPhoto":e.preventDefault();readItemFields();sheet.blob=null;sheet.small=null;sheet.preview="";sheet.removePhoto=true;drawSheet();break;
    case "saveItem":saveItem();break;
    case "delItem":readItemFields();sheet.confirmDel=true;sheet.usedIn=Object.values(S.outfit).filter(o=>(o.capi||[]).includes(sheet.id)).length;drawSheet();break;
    case "delItemNo":sheet.confirmDel=false;drawSheet();break;
    case "delItemYes":deleteItem();break;
    case "newOutfit":openSheet({type:"outfit",cat:"Tutti",d:{capi:[]}});break;
    case "newOutfitFor":openSheet({type:"outfit",cat:"Tutti",forDate:t.dataset.k,d:{capi:[]}});break;
    case "editOutfit":{const o=S.outfit[t.dataset.id];if(o)openSheet({type:"outfit",cat:"Tutti",id:o.id,d:{...o,capi:(o.capi||[]).filter(id=>S.capi[id])}});break}
    case "ocat":readOutfitFields();sheet.cat=t.dataset.v;drawSheet();break;
    case "toggle":{readOutfitFields();const id=t.dataset.id,c=sheet.d.capi;sheet.d.capi=c.includes(id)?c.filter(x=>x!==id):[...c,id];drawSheet();root.querySelector('[data-act="toggle"][data-id="'+id+'"]')?.focus();break}
    case "saveOutfit":saveOutfit();break;
    case "delOutfit":readOutfitFields();sheet.confirmDel=true;drawSheet();break;
    case "delOutfitNo":sheet.confirmDel=false;drawSheet();break;
    case "delOutfitYes":deleteOutfit();break;
    case "planOutfit":openSheet({type:"planOutfit",id:t.dataset.id,k:S.sel>=todayKey()?S.sel:todayKey()});break;
    case "planOutfitSave":{const k=document.getElementById("pDate").value;if(!k){toast("Scegli una data",true);return}const g=S.giorni[k];try{await putDoc("giorni",k,{outfit:sheet.id,nota:g?.nota||""});toast("Pianificato per "+longDate(k));S.sel=k;S.week=weekStart(k);closeSheet()}catch(err){toast(errMsg(err),true)}break}
  }
});
document.addEventListener("change",e=>{
  const id=e.target.id;
  if(id==="fFoto"){setPhoto(e.target.files[0]);e.target.value=""}
  else if(id==="impFile"){const f=e.target.files[0];e.target.value="";if(f)readBackup(f)}
  else if(id==="fStag"){S.stag=e.target.value;render()}
  else if(id==="fOcc"){S.occ=e.target.value;render()}
  else if(id==="fSort"){S.sort=e.target.value;render()}
  else if(id==="wSave"&&sheet){readWornFields();sheet.saveAs=e.target.checked;drawSheet();if(sheet.saveAs)setTimeout(()=>document.getElementById("wNome")?.focus(),20)}
  else if(id==="goDate"&&e.target.value){S.sel=e.target.value;S.week=weekStart(S.sel);render()}
  else if(id==="pDate"&&sheet){sheet.k=e.target.value;drawSheet()}
  else if(id==="dayNote"&&S.canWrite){const k=S.sel,g=S.giorni[k],v=e.target.value.trim();
    if((g?.nota||"")===v)return;
    (v||g?.outfit||(g?.capi&&g.capi.length)?putDoc("giorni",k,{...(g||{}),outfit:g?.outfit||"",nota:v}):delDoc("giorni",k)).then(()=>toast("Nota salvata")).catch(err=>toast(errMsg(err),true))}
});
document.addEventListener("input",e=>{if(e.target.id==="q"){S.q=e.target.value;const pos=e.target.selectionStart;render();const q=document.getElementById("q");q.focus();try{q.setSelectionRange(pos,pos)}catch(_){}}});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&sheet)closeSheet()});
document.addEventListener("error",e=>{if(e.target.tagName==="IMG"&&e.target.closest(".thumb"))e.target.hidden=true},true);
document.addEventListener("dragover",e=>{const d=e.target.closest&&e.target.closest("#drop");if(d){e.preventDefault();d.classList.add("over")}});
document.addEventListener("dragleave",e=>{const d=e.target.closest&&e.target.closest("#drop");if(d)d.classList.remove("over")});
document.addEventListener("drop",e=>{const d=e.target.closest&&e.target.closest("#drop");if(d){e.preventDefault();setPhoto(e.dataTransfer.files[0])}});
document.addEventListener("paste",e=>{if(sheet?.type!=="item")return;const f=[...(e.clipboardData?.files||[])].find(f=>f.type.startsWith("image/"));if(f){e.preventDefault();setPhoto(f)}});

function route(){const h=location.hash.slice(1);S.tab=["capi","outfit","settimana"].includes(h)?h:"settimana";render()}
window.addEventListener("hashchange",route);

/* ---------- avvio ---------- */
function notice(html){const n=document.getElementById("notice");n.innerHTML=html||"";n.hidden=!html}
async function start(){
  route();
  try{
    if(!("indexedDB" in window))throw new Error("noidb");
    IDB=await idbOpen();await loadAll();S.mode="local";
    try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(_){}
  }catch(e){
    S.mode="local";notice("Questo browser non permette di salvare i dati (forse sei in navigazione privata): le modifiche andranno perse alla chiusura.");
    IDB=null;
  }
  render();
  if("serviceWorker" in navigator&&location.protocol.startsWith("http")){navigator.serviceWorker.register("sw.js").catch(()=>{})}
}
start();
})();
</script>
</body>
</html>
